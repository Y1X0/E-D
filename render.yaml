# Render blueprint: the website, the payment service, and its database.
#
# The site stays exactly what it was — a static build on a CDN. The payment
# service is a separate process with its own database, so nothing about taking
# money runs inside the pages a visitor loads.
services:
  - type: web
    name: elite-evening-design
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: SITE_URL
        sync: false
      - key: SANITY_PROJECT_ID
        sync: false
      - key: SANITY_DATASET
        value: production
      - key: PAYMENT_API_URL
        fromService:
          name: elite-evening-payments
          type: web
          property: hostport
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: elite-evening-payments
    runtime: node
    rootDir: server
    plan: starter
    healthCheckPath: /healthz
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: PAYMENT_CURRENCY
        value: ILS
      # secrets are set in the Render dashboard, never in this file
      - key: PAYMENT_SERVER_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: PAYMENT_BASE_URL
        sync: false
      - key: PAYMENT_RETURN_URL
        sync: false
      - key: PAYMENT_CANCEL_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: elite-evening-orders
          property: connectionString

databases:
  - name: elite-evening-orders
    plan: basic-256mb
    postgresMajorVersion: "16"
